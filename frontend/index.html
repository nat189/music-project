<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>YouTube Music Clone</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts (Prompt) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      font-family: 'Prompt', sans-serif;
      background-color: #030303;
      color: #ffffff;
      -webkit-tap-highlight-color: transparent;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .line-clamp-1 { display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
    .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  </style>
</head>
<body class="flex justify-center min-h-screen bg-black select-none">

  <!-- HTML5 Native Audio Player (รับสัญญาณเสียงตรงผ่าน yt-dlp เลี่ยง Error 150) -->
  <audio id="native-audio" preload="auto"></audio>

  <!-- Mobile Frame Container -->
  <div class="relative w-full max-w-md bg-[#030303] min-h-screen pb-32 flex flex-col shadow-2xl overflow-x-hidden">

    <!-- Top Header -->
    <header class="sticky top-0 z-30 flex items-center justify-between px-4 py-3 bg-[#030303]/90 backdrop-blur-md">
      <div class="flex items-center gap-1.5 cursor-pointer" onclick="switchTab('home')">
        <div class="flex items-center justify-center w-7 h-7 bg-red-600 rounded-full text-white">
          <i data-lucide="play" class="w-3.5 h-3.5 fill-white ml-0.5"></i>
        </div>
        <span class="text-xl font-bold tracking-tight">Music</span>
      </div>
      <div class="flex items-center gap-4">
        <button onclick="switchTab('search')" class="text-gray-300 hover:text-white transition">
          <i data-lucide="search" class="w-5 h-5"></i>
        </button>
        <div class="w-7 h-7 rounded-full bg-emerald-600 overflow-hidden border border-gray-700">
          <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&auto=format&fit=crop" class="w-full h-full object-cover" alt="Avatar"/>
        </div>
      </div>
    </header>

    <!-- ==================== TAB 1: หน้าแรก (HOME) ==================== -->
    <main id="tab-home" class="tab-content flex flex-col">
      <!-- Filter Mood Chips -->
      <div class="flex gap-2 px-4 py-2 overflow-x-auto no-scrollbar">
        <button onclick="filterCategory('all', this)" class="mood-chip px-3.5 py-1.5 rounded-lg text-xs font-medium bg-white text-black whitespace-nowrap transition">ทั้งหมด</button>
        <button onclick="filterCategory('hit', this)" class="mood-chip px-3.5 py-1.5 rounded-lg text-xs font-medium bg-[#212121] text-gray-200 whitespace-nowrap transition">ฮิตติดชาร์ต</button>
        <button onclick="filterCategory('relax', this)" class="mood-chip px-3.5 py-1.5 rounded-lg text-xs font-medium bg-[#212121] text-gray-200 whitespace-nowrap transition">ผ่อนคลาย</button>
        <button onclick="filterCategory('rock', this)" class="mood-chip px-3.5 py-1.5 rounded-lg text-xs font-medium bg-[#212121] text-gray-200 whitespace-nowrap transition">กระปรี้กระเปร่า</button>
      </div>

      <!-- Quick Picks Section -->
      <section class="mt-4 px-4">
        <div class="flex items-center gap-2 mb-2">
          <div class="w-5 h-5 rounded-full overflow-hidden">
            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&auto=format&fit=crop" class="w-full h-full object-cover" alt="User"/>
          </div>
          <span class="text-xs text-gray-400 uppercase tracking-wide">NAPAT</span>
        </div>
        <h2 class="text-2xl font-bold tracking-tight mb-3">โทรด่วน / เพลงแนะนำ</h2>

        <!-- Grid 3x3 Cards -->
        <div id="quick-picks-grid" class="grid grid-cols-3 gap-3"></div>

        <!-- Pagination Dots -->
        <div class="flex justify-center items-center gap-1.5 mt-4">
          <div class="w-1.5 h-1.5 rounded-full bg-white"></div>
          <div class="w-1.5 h-1.5 rounded-full bg-gray-600"></div>
          <div class="w-1.5 h-1.5 rounded-full bg-gray-600"></div>
        </div>
      </section>

      <!-- Curated Section -->
      <section class="mt-8 px-4">
        <div class="flex items-center justify-between mb-3">
          <h2 class="text-xl font-bold tracking-tight">คัดสรรมาแล้ว</h2>
          <button onclick="playSong(currentSongList[0])" class="text-xs text-gray-400 hover:text-white px-2.5 py-1 rounded-full border border-gray-700">เล่นทั้งหมด</button>
        </div>
        <div id="curated-list" class="flex flex-col gap-2"></div>
      </section>
    </main>

    <!-- ==================== TAB 2: ค้นหาเพลง (SEARCH) ==================== -->
    <main id="tab-search" class="tab-content hidden flex-col px-4 pt-2">
      <!-- Search Input Box -->
      <div class="relative flex items-center mb-2">
        <i data-lucide="search" class="w-4 h-4 text-gray-400 absolute left-3.5 pointer-events-none"></i>
        <input id="search-input" type="text" placeholder="ค้นหาเพลงไทย ศิลปิน เช่น โจอี้ ภูวศิษฐ์..." 
               class="w-full pl-10 pr-10 py-2.5 bg-[#212121] rounded-lg text-sm text-white placeholder-gray-400 focus:outline-none focus:ring-1 focus:ring-red-600"
               onkeypress="if(event.key === 'Enter') searchSong()" />
        <button id="search-clear-btn" onclick="clearSearch()" class="hidden absolute right-3 text-gray-400 hover:text-white">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <!-- Quick Search Thai Tags -->
      <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-1 mb-3 text-[11px]">
        <span class="text-gray-500 whitespace-nowrap">แนะนำ:</span>
        <button onclick="quickTagSearch('นะหน้าทอง')" class="px-2.5 py-1 rounded-full bg-[#1e1e1e] hover:bg-[#2e2e2e] text-gray-300 whitespace-nowrap">นะหน้าทอง</button>
        <button onclick="quickTagSearch('โจอี้ ภูวศิษฐ์')" class="px-2.5 py-1 rounded-full bg-[#1e1e1e] hover:bg-[#2e2e2e] text-gray-300 whitespace-nowrap">โจอี้ ภูวศิษฐ์</button>
        <button onclick="quickTagSearch('โต๊ะริม นนท์ ธนนท์')" class="px-2.5 py-1 rounded-full bg-[#1e1e1e] hover:bg-[#2e2e2e] text-gray-300 whitespace-nowrap">นนท์ ธนนท์</button>
        <button onclick="quickTagSearch('Tilly Birds')" class="px-2.5 py-1 rounded-full bg-[#1e1e1e] hover:bg-[#2e2e2e] text-gray-300 whitespace-nowrap">Tilly Birds</button>
        <button onclick="quickTagSearch('กลิ่นดอกไม้ Newery')" class="px-2.5 py-1 rounded-full bg-[#1e1e1e] hover:bg-[#2e2e2e] text-gray-300 whitespace-nowrap">กลิ่นดอกไม้</button>
      </div>

      <button onclick="searchSong()" class="w-full py-2.5 bg-red-600 hover:bg-red-700 text-white rounded-lg text-xs font-semibold mb-4 transition flex items-center justify-center gap-1.5">
        <i data-lucide="search" class="w-4 h-4"></i> ค้นหาเพลงทันที
      </button>

      <!-- Search Results List -->
      <div id="search-results" class="flex flex-col gap-2 pb-10">
        <p class="text-xs text-gray-500 text-center py-8">พิมพ์ชื่อเพลง หรือแตะปุ่มแนะนำด้านบนเพื่อเริ่มค้นหา</p>
      </div>
    </main>

    <!-- ==================== TAB 3: คลังเพลง (LIBRARY) ==================== -->
    <main id="tab-library" class="tab-content hidden flex-col px-4 pt-4">
      <h2 class="text-2xl font-bold tracking-tight mb-4">คลังเพลงของคุณ</h2>
      <h3 class="text-sm font-semibold text-gray-300 mb-2 flex items-center gap-1.5">
        <i data-lucide="history" class="w-4 h-4 text-red-500"></i> เพลงที่เพิ่งฟังล่าสุด
      </h3>
      <div id="library-recent-list" class="flex flex-col gap-2 pb-10">
        <p class="text-xs text-gray-500 py-4">ยังไม่มีประวัติการฟังเพลง</p>
      </div>
    </main>

    <!-- Floating Mini Player -->
    <div id="mini-player" class="fixed bottom-[54px] left-1/2 -translate-x-1/2 w-full max-w-md px-3 z-40">
      <div class="bg-[#212121] rounded-lg p-2 flex items-center justify-between shadow-2xl border border-white/5 backdrop-blur-md">
        <div class="flex items-center gap-3 overflow-hidden cursor-pointer flex-1" onclick="openFullPlayer()">
          <img id="player-thumb" src="https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=100&auto=format&fit=crop" class="w-10 h-10 rounded object-cover flex-shrink-0" alt="Cover"/>
          <div class="overflow-hidden">
            <h4 id="player-title" class="text-sm font-semibold text-white line-clamp-1">เลือกเพลงเพื่อฟัง</h4>
            <p id="player-artist" class="text-xs text-gray-400 line-clamp-1">แตะการ์ดเพลงหรือค้นหาเพลง</p>
          </div>
        </div>
        <div class="flex items-center gap-2 pl-2">
          <button id="play-pause-btn" class="p-1.5 text-white transition">
            <i id="play-pause-icon" data-lucide="play" class="w-6 h-6 fill-white"></i>
          </button>
        </div>
      </div>
      <!-- Clickable Progress Bar -->
      <div class="w-full bg-gray-700 h-[3px] mt-0.5 rounded-full overflow-hidden cursor-pointer" onclick="seekByBar(event)">
        <div id="player-progress" class="bg-red-500 h-full w-0 transition-all duration-200"></div>
      </div>
    </div>

    <!-- ==================== FULL SCREEN PLAYER MODAL ==================== -->
    <div id="full-player-modal" class="fixed inset-0 bg-[#030303] z-50 flex flex-col justify-between p-6 transform translate-y-full transition-transform duration-300 ease-out max-w-md mx-auto">
      <div class="flex items-center justify-between">
        <button onclick="closeFullPlayer()" class="p-2 text-gray-400 hover:text-white">
          <i data-lucide="chevron-down" class="w-6 h-6"></i>
        </button>
        <span class="text-xs font-semibold uppercase tracking-widest text-gray-400">กำลังเล่นเพลง</span>
        <div class="w-6"></div>
      </div>

      <div class="flex flex-col items-center my-auto">
        <div class="w-64 h-64 rounded-2xl overflow-hidden shadow-2xl border border-white/10 mb-8 bg-[#181818]">
          <img id="full-player-thumb" src="https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=500&auto=format&fit=crop" class="w-full h-full object-cover" alt="Cover" />
        </div>
        <h2 id="full-player-title" class="text-xl font-bold text-center text-white line-clamp-1 px-4 mb-1">ชื่อเพลง</h2>
        <p id="full-player-artist" class="text-sm text-gray-400 text-center line-clamp-1">ศิลปิน</p>
      </div>

      <div class="flex flex-col gap-4">
        <div>
          <input id="full-player-seek" type="range" min="0" max="100" value="0" class="w-full h-1 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-red-600" onchange="seekSong(this.value)">
          <div class="flex justify-between text-[11px] text-gray-400 mt-1">
            <span id="current-time">0:00</span>
            <span id="duration-time">0:00</span>
          </div>
        </div>

        <div class="flex items-center justify-center gap-8 py-2">
          <button onclick="prevSong()" class="text-gray-300 hover:text-white">
            <i data-lucide="skip-back" class="w-7 h-7 fill-current"></i>
          </button>
          <button onclick="togglePlayPause()" class="w-14 h-14 bg-white text-black rounded-full flex items-center justify-center hover:scale-105 transition">
            <i id="full-play-icon" data-lucide="play" class="w-6 h-6 fill-black ml-0.5"></i>
          </button>
          <button onclick="nextSong()" class="text-gray-300 hover:text-white">
            <i data-lucide="skip-forward" class="w-7 h-7 fill-current"></i>
          </button>
        </div>
      </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <nav class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md bg-[#101010]/95 border-t border-white/5 py-1.5 px-3 z-50 flex justify-around items-center backdrop-blur-lg">
      <button id="nav-home" onclick="switchTab('home')" class="nav-btn flex flex-col items-center text-white gap-1">
        <i data-lucide="home" class="w-5 h-5"></i>
        <span class="text-[10px] font-medium">หน้าแรก</span>
      </button>
      <button id="nav-search" onclick="switchTab('search')" class="nav-btn flex flex-col items-center text-gray-400 hover:text-white gap-1">
        <i data-lucide="search" class="w-5 h-5"></i>
        <span class="text-[10px] font-medium">ค้นหา</span>
      </button>
      <button id="nav-library" onclick="switchTab('library')" class="nav-btn flex flex-col items-center text-gray-400 hover:text-white gap-1">
        <i data-lucide="library" class="w-5 h-5"></i>
        <span class="text-[10px] font-medium">คลังเพลง</span>
      </button>
    </nav>

  </div>

  <script>
    // ** URL Backend จาก Render ของคุณ **
    const BACKEND_URL = 'https://napat-music.onrender.com';

    const audio = document.getElementById('native-audio');
    let isPlaying = false;
    let currentSong = null;
    let recentHistory = JSON.parse(localStorage.getItem('yt_music_history') || '[]');

    // คลังเพลงไทยเริ่มต้นสำหรับแสดงในหน้าแรกทันที
    const defaultSongs = {
      all: [
        { id: 'QQG1Xav6tm0', title: 'นะหน้าทอง', artist: 'โจอี้ ภูวศิษฐ์', cover: 'https://img.youtube.com/vi/QQG1Xav6tm0/hqdefault.jpg' },
        { id: 'zwvv71slEYc', title: 'ถ้าเราเจอกันอีก (Until Then)', artist: 'Tilly Birds', cover: 'https://img.youtube.com/vi/zwvv71slEYc/hqdefault.jpg' },
        { id: 'IP5F-ASWX1g', title: 'โต๊ะริม (melt)', artist: 'NONT TANONT', cover: 'https://img.youtube.com/vi/IP5F-ASWX1g/hqdefault.jpg' },
        { id: '71KuVORecY8', title: 'กลิ่นดอกไม้', artist: 'Newery', cover: 'https://img.youtube.com/vi/71KuVORecY8/hqdefault.jpg' },
        { id: 'v-ZV30Z1fes', title: 'พิจารณา (Consider)', artist: 'Musketeers Ft. MAIYARAP', cover: 'https://img.youtube.com/vi/v-ZV30Z1fes/hqdefault.jpg' },
        { id: 'sVQj0Nco7do', title: 'ซ่อนกลิ่น', artist: 'PALMY', cover: 'https://img.youtube.com/vi/sVQj0Nco7do/hqdefault.jpg' },
        { id: 'dw8O75NqV3U', title: 'เสแสร้ง (Pretend)', artist: 'Paper Planes feat. MOON', cover: 'https://img.youtube.com/vi/dw8O75NqV3U/hqdefault.jpg' },
        { id: 'DWcJFNfaw9c', title: 'Wish (Acoustic Guitar)', artist: 'Depapepe', cover: 'https://img.youtube.com/vi/DWcJFNfaw9c/hqdefault.jpg' },
        { id: 'bM7SZ5SBzyY', title: 'Sky High', artist: 'Elektronomia', cover: 'https://img.youtube.com/vi/bM7SZ5SBzyY/hqdefault.jpg' }
      ],
      hit: [
        { id: 'QQG1Xav6tm0', title: 'นะหน้าทอง', artist: 'โจอี้ ภูวศิษฐ์', cover: 'https://img.youtube.com/vi/QQG1Xav6tm0/hqdefault.jpg' },
        { id: 'IP5F-ASWX1g', title: 'โต๊ะริม (melt)', artist: 'NONT TANONT', cover: 'https://img.youtube.com/vi/IP5F-ASWX1g/hqdefault.jpg' },
        { id: 'zwvv71slEYc', title: 'ถ้าเราเจอกันอีก', artist: 'Tilly Birds', cover: 'https://img.youtube.com/vi/zwvv71slEYc/hqdefault.jpg' }
      ],
      relax: [
        { id: '71KuVORecY8', title: 'กลิ่นดอกไม้', artist: 'Newery', cover: 'https://img.youtube.com/vi/71KuVORecY8/hqdefault.jpg' },
        { id: 'sVQj0Nco7do', title: 'ซ่อนกลิ่น', artist: 'PALMY', cover: 'https://img.youtube.com/vi/sVQj0Nco7do/hqdefault.jpg' },
        { id: 'DWcJFNfaw9c', title: 'Wish', artist: 'Depapepe', cover: 'https://img.youtube.com/vi/DWcJFNfaw9c/hqdefault.jpg' }
      ],
      rock: [
        { id: 'dw8O75NqV3U', title: 'เสแสร้ง', artist: 'Paper Planes', cover: 'https://img.youtube.com/vi/dw8O75NqV3U/hqdefault.jpg' },
        { id: 'v-ZV30Z1fes', title: 'พิจารณา', artist: 'Musketeers', cover: 'https://img.youtube.com/vi/v-ZV30Z1fes/hqdefault.jpg' }
      ]
    };

    let currentSongList = [...defaultSongs.all];

    // ==================== ฟังก์ชันเล่นเพลงผ่าน Audio Stream ====================
    function playSong(song) {
      if (!song || !song.id) return;
      currentSong = song;

      // บันทึกลงประวัติการฟัง
      recentHistory = recentHistory.filter(s => s.id !== song.id);
      recentHistory.unshift(song);
      if (recentHistory.length > 20) recentHistory.pop();
      localStorage.setItem('yt_music_history', JSON.stringify(recentHistory));
      renderLibrary();

      // อัปเดต UI Mini Player
      document.getElementById('player-thumb').src = song.cover;
      document.getElementById('player-title').innerText = song.title;
      document.getElementById('player-artist').innerText = song.artist;

      // อัปเดต UI Full Player
      document.getElementById('full-player-thumb').src = song.cover;
      document.getElementById('full-player-title').innerText = song.title;
      document.getElementById('full-player-artist').innerText = song.artist;

      // ส่งคำขอสตรีมสดไปยัง Backend Render โดยตรง
      audio.src = `${BACKEND_URL}/api/stream?id=${song.id}`;
      audio.load();
      audio.play().then(() => {
        isPlaying = true;
        updatePlayIcons(true);
      }).catch(err => {
        console.warn("Autoplay was prevented or error:", err);
      });
    }

    function togglePlayPause() {
      if (!currentSong) {
        playSong(currentSongList[0]);
        return;
      }
      if (audio.paused) {
        audio.play();
        isPlaying = true;
      } else {
        audio.pause();
        isPlaying = false;
      }
      updatePlayIcons(isPlaying);
    }

    document.getElementById('play-pause-btn').onclick = (e) => {
      e.stopPropagation();
      togglePlayPause();
    };

    function updatePlayIcons(playing) {
      const miniIcon = document.getElementById('play-pause-icon');
      const fullIcon = document.getElementById('full-play-icon');
      if (playing) {
        miniIcon.setAttribute('data-lucide', 'pause');
        fullIcon.setAttribute('data-lucide', 'pause');
      } else {
        miniIcon.setAttribute('data-lucide', 'play');
        fullIcon.setAttribute('data-lucide', 'play');
      }
      lucide.createIcons();
    }

    // อัปเดตแถบเวลา (Progress Bar)
    audio.ontimeupdate = () => {
      if (audio.duration) {
        const pct = (audio.currentTime / audio.duration) * 100;
        document.getElementById('player-progress').style.width = pct + '%';
        document.getElementById('full-player-seek').value = pct;
        document.getElementById('current-time').innerText = formatTime(audio.currentTime);
        document.getElementById('duration-time').innerText = formatTime(audio.duration);
      }
    };

    audio.onended = () => {
      nextSong();
    };

    function formatTime(sec) {
      if (isNaN(sec)) return '0:00';
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function seekSong(val) {
      if (audio.duration) {
        audio.currentTime = (val / 100) * audio.duration;
      }
    }

    function seekByBar(e) {
      const rect = e.currentTarget.getBoundingClientRect();
      const clickPos = (e.clientX - rect.left) / rect.width;
      if (audio.duration) {
        audio.currentTime = clickPos * audio.duration;
      }
    }

    function nextSong() {
      const idx = currentSongList.findIndex(s => s.id === currentSong?.id);
      if (idx !== -1 && idx + 1 < currentSongList.length) {
        playSong(currentSongList[idx + 1]);
      } else {
        playSong(currentSongList[0]);
      }
    }

    function prevSong() {
      const idx = currentSongList.findIndex(s => s.id === currentSong?.id);
      if (idx > 0) {
        playSong(currentSongList[idx - 1]);
      }
    }

    // ==================== ระบบค้นหาผ่าน Backend ====================
    async function searchSong() {
      const q = document.getElementById('search-input').value.trim();
      if (!q) return;

      const container = document.getElementById('search-results');
      container.innerHTML = `
        <div class="text-center py-8">
          <div class="inline-block animate-spin w-6 h-6 border-2 border-red-600 border-t-transparent rounded-full mb-2"></div>
          <p class="text-xs text-gray-300">กำลังค้นหา "${q}" ผ่านเซิร์ฟเวอร์...</p>
          <p class="text-[11px] text-gray-500 mt-1">(หากเซิร์ฟเวอร์เพิ่งตื่น อาจใช้เวลา 20-40 วินาทีในครั้งแรก)</p>
        </div>
      `;

      try {
        const res = await fetch(`${BACKEND_URL}/api/search?q=${encodeURIComponent(q)}`);
        const songs = await res.json();

        if (songs && songs.length > 0) {
          container.innerHTML = `<p class="text-xs text-gray-400 mb-2">พบ ${songs.length} เพลง:</p>`;
          songs.forEach(song => renderSongItem(song, container));
          lucide.createIcons();
        } else {
          container.innerHTML = `<p class="text-xs text-gray-500 text-center py-8">ไม่พบเพลงที่ค้นหา</p>`;
        }
      } catch (err) {
        container.innerHTML = `
          <div class="text-center py-8 bg-[#141414] p-4 rounded-lg border border-red-900/30">
            <p class="text-xs text-red-400 font-semibold mb-1">เชื่อมต่อเซิร์ฟเวอร์ไม่สำเร็จ</p>
            <p class="text-[11px] text-gray-400 mb-3">เซิร์ฟเวอร์ Render กำลังอยู่ในสถานะเริ่มทำงาน (Cold Start) กรุณารอสักครู่แล้วกดค้นหาใหม่อีกครั้งครับ</p>
            <button onclick="searchSong()" class="px-3 py-1 bg-red-600 hover:bg-red-700 text-white rounded text-xs">ลองค้นหาอีกครั้ง</button>
          </div>
        `;
      }
    }

    function quickTagSearch(name) {
      document.getElementById('search-input').value = name;
      searchSong();
    }

    function clearSearch() {
      document.getElementById('search-input').value = '';
      document.getElementById('search-results').innerHTML = '<p class="text-xs text-gray-500 text-center py-8">พิมพ์ชื่อเพลง หรือแตะปุ่มแนะนำด้านบนเพื่อเริ่มค้นหา</p>';
    }

    function renderSongItem(song, container) {
      const div = document.createElement('div');
      div.className = "flex items-center justify-between p-2 rounded-lg hover:bg-[#1a1a1a] cursor-pointer transition border border-white/5";
      div.innerHTML = `
        <div class="flex items-center gap-3 overflow-hidden">
          <img src="${song.cover}" class="w-12 h-12 rounded object-cover flex-shrink-0 bg-[#1e1e1e]" alt="Thumb" onerror="this.src='https://img.youtube.com/vi/${song.id}/hqdefault.jpg'"/>
          <div class="overflow-hidden">
            <h4 class="text-sm font-medium text-white line-clamp-1">${song.title}</h4>
            <p class="text-xs text-gray-400 line-clamp-1">${song.artist}</p>
          </div>
        </div>
        <button class="p-2 text-gray-300 hover:text-white">
          <i data-lucide="play" class="w-5 h-5 fill-current"></i>
        </button>
      `;
      div.onclick = () => playSong(song);
      container.appendChild(div);
    }

    // ==================== RENDERING & NAVIGATION ====================
    function renderHome() {
      const grid = document.getElementById('quick-picks-grid');
      grid.innerHTML = '';
      currentSongList.slice(0, 9).forEach(song => {
        const card = document.createElement('div');
        card.className = "cursor-pointer group flex flex-col";
        card.innerHTML = `
          <div class="relative w-full aspect-square rounded-lg overflow-hidden mb-1.5 bg-[#181818]">
            <img src="${song.cover}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" alt="${song.title}"/>
            <div class="absolute inset-0 bg-black/20 group-hover:bg-black/40 flex items-center justify-center opacity-0 group-hover:opacity-100 transition">
              <i data-lucide="play" class="w-6 h-6 text-white fill-white"></i>
            </div>
          </div>
          <h3 class="text-xs font-medium text-white line-clamp-1">${song.title}</h3>
          <p class="text-[10px] text-gray-400 line-clamp-1">${song.artist}</p>
        `;
        card.onclick = () => playSong(song);
        grid.appendChild(card);
      });

      const curated = document.getElementById('curated-list');
      curated.innerHTML = '';
      currentSongList.slice(0, 5).forEach(song => renderSongItem(song, curated));
      lucide.createIcons();
    }

    function filterCategory(cat, btn) {
      document.querySelectorAll('.mood-chip').forEach(c => {
        c.className = "mood-chip px-3.5 py-1.5 rounded-lg text-xs font-medium bg-[#212121] text-gray-200 whitespace-nowrap transition";
      });
      btn.className = "mood-chip px-3.5 py-1.5 rounded-lg text-xs font-medium bg-white text-black whitespace-nowrap transition";

      if (cat === 'all') {
        currentSongList = defaultSongs.all;
      } else if (defaultSongs[cat]) {
        currentSongList = defaultSongs[cat];
      }
      renderHome();
    }

    function renderLibrary() {
      const lib = document.getElementById('library-recent-list');
      if (recentHistory.length === 0) {
        lib.innerHTML = '<p class="text-xs text-gray-500 py-4">ยังไม่มีประวัติการฟังเพลง</p>';
        return;
      }
      lib.innerHTML = '';
      recentHistory.forEach(song => renderSongItem(song, lib));
      lucide.createIcons();
    }

    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden'));
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.remove('text-white');
        btn.classList.add('text-gray-400');
      });

      document.getElementById(`tab-${tabId}`).classList.remove('hidden');
      const activeNav = document.getElementById(`nav-${tabId}`);
      if (activeNav) {
        activeNav.classList.remove('text-gray-400');
        activeNav.classList.add('text-white');
      }
      lucide.createIcons();
    }

    function openFullPlayer() {
      document.getElementById('full-player-modal').classList.remove('translate-y-full');
    }
    function closeFullPlayer() {
      document.getElementById('full-player-modal').classList.add('translate-y-full');
    }

    // Init
    renderHome();
    renderLibrary();
    lucide.createIcons();
  </script>
</body>
</html>
