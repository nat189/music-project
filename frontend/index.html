<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>YouTube Music Clone</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { font-family: 'Prompt', sans-serif; background-color: #030303; color: #ffffff; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .line-clamp-1 { display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
  </style>
</head>
<body class="flex justify-center min-h-screen bg-black select-none">

  <!-- แท็กเล่นเสียงมาตรฐาน ไม่ติดปัญหา Error 150 -->
  <audio id="native-audio" preload="auto"></audio>

  <div class="relative w-full max-w-md bg-[#030303] min-h-screen pb-32 flex flex-col shadow-2xl overflow-x-hidden">

    <!-- Header -->
    <header class="sticky top-0 z-30 flex items-center justify-between px-4 py-3 bg-[#030303]/90 backdrop-blur-md">
      <div class="flex items-center gap-1.5 cursor-pointer" onclick="switchTab('home')">
        <div class="flex items-center justify-center w-7 h-7 bg-red-600 rounded-full text-white">
          <i data-lucide="play" class="w-3.5 h-3.5 fill-white ml-0.5"></i>
        </div>
        <span class="text-xl font-bold tracking-tight">Music</span>
      </div>
      <div class="flex items-center gap-4">
        <button onclick="switchTab('search')" class="text-gray-300 hover:text-white">
          <i data-lucide="search" class="w-5 h-5"></i>
        </button>
        <div class="w-7 h-7 rounded-full bg-emerald-600 overflow-hidden border border-gray-700">
          <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&auto=format&fit=crop" class="w-full h-full object-cover"/>
        </div>
      </div>
    </header>

    <!-- TAB 1: หน้าแรก -->
    <main id="tab-home" class="tab-content flex flex-col px-4">
      <h2 class="text-2xl font-bold tracking-tight mt-4 mb-3">แนะนำสำหรับคุณ</h2>
      <div id="home-grid" class="grid grid-cols-3 gap-3"></div>
    </main>

    <!-- TAB 2: ค้นหาเพลง -->
    <main id="tab-search" class="tab-content hidden flex-col px-4 pt-2">
      <div class="relative flex items-center mb-3">
        <i data-lucide="search" class="w-4 h-4 text-gray-400 absolute left-3.5"></i>
        <input id="search-input" type="text" placeholder="ค้นหาเพลงไทย ศิลปิน เช่น โจอี้ ภูวศิษฐ์..." 
               class="w-full pl-10 pr-4 py-2.5 bg-[#212121] rounded-lg text-sm text-white placeholder-gray-400 focus:outline-none focus:ring-1 focus:ring-red-600"
               onkeypress="if(event.key === 'Enter') searchSong()" />
      </div>
      <button onclick="searchSong()" class="w-full py-2.5 bg-red-600 hover:bg-red-700 text-white rounded-lg text-xs font-semibold mb-4 transition">
        ค้นหาเพลงทันที
      </button>
      <div id="search-results" class="flex flex-col gap-2 pb-10">
        <p class="text-xs text-gray-500 text-center py-8">พิมพ์ชื่อเพลงเพื่อค้นหาเพลงจาก YouTube ได้ทุกเพลง</p>
      </div>
    </main>

    <!-- Mini Player -->
    <div id="mini-player" class="fixed bottom-[54px] left-1/2 -translate-x-1/2 w-full max-w-md px-3 z-40">
      <div class="bg-[#212121] rounded-lg p-2 flex items-center justify-between shadow-2xl border border-white/5 backdrop-blur-md">
        <div class="flex items-center gap-3 overflow-hidden flex-1">
          <img id="player-thumb" src="https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=100&auto=format&fit=crop" class="w-10 h-10 rounded object-cover flex-shrink-0"/>
          <div class="overflow-hidden">
            <h4 id="player-title" class="text-sm font-semibold text-white line-clamp-1">เลือกเพลงเพื่อฟัง</h4>
            <p id="player-artist" class="text-xs text-gray-400 line-clamp-1">แตะค้นหาเพลงไทยได้เลย</p>
          </div>
        </div>
        <button id="play-pause-btn" class="p-2 text-white">
          <i id="play-icon" data-lucide="play" class="w-6 h-6 fill-white"></i>
        </button>
      </div>
      <div class="w-full bg-gray-700 h-[2px] mt-0.5 rounded-full overflow-hidden">
        <div id="player-progress" class="bg-red-500 h-full w-0 transition-all duration-300"></div>
      </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <nav class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md bg-[#101010]/95 border-t border-white/5 py-1.5 px-3 z-50 flex justify-around items-center">
      <button onclick="switchTab('home')" class="nav-btn flex flex-col items-center text-white gap-1">
        <i data-lucide="home" class="w-5 h-5"></i>
        <span class="text-[10px]">หน้าแรก</span>
      </button>
      <button onclick="switchTab('search')" class="nav-btn flex flex-col items-center text-gray-400 hover:text-white gap-1">
        <i data-lucide="search" class="w-5 h-5"></i>
        <span class="text-[10px]">ค้นหา</span>
      </button>
    </nav>

  </div>

  <script>
    // ** ใส่ URL Backend ที่ได้จาก Render ที่นี่ **
    const BACKEND_URL = 'https://nat-music-backend.onrender.com';

    const audio = document.getElementById('native-audio');
    let isPlaying = false;

    // ระบบค้นหาเพลงผ่าน Backend
    async function searchSong() {
      const q = document.getElementById('search-input').value.trim();
      if (!q) return;

      const container = document.getElementById('search-results');
      container.innerHTML = `<p class="text-xs text-gray-400 text-center py-6">กำลังค้นหา "${q}" ผ่านเซิร์ฟเวอร์...</p>`;

      try {
        const res = await fetch(`${BACKEND_URL}/api/search?q=${encodeURIComponent(q)}`);
        const songs = await res.json();
        
        if (songs && songs.length > 0) {
          container.innerHTML = '';
          songs.forEach(song => {
            const div = document.createElement('div');
            div.className = "flex items-center justify-between p-2 rounded-lg hover:bg-[#1a1a1a] cursor-pointer transition border border-white/5";
            div.innerHTML = `
              <div class="flex items-center gap-3 overflow-hidden">
                <img src="${song.cover}" class="w-12 h-12 rounded object-cover flex-shrink-0 bg-[#1e1e1e]"/>
                <div class="overflow-hidden">
                  <h4 class="text-sm font-medium text-white line-clamp-1">${song.title}</h4>
                  <p class="text-xs text-gray-400 line-clamp-1">${song.artist}</p>
                </div>
              </div>
              <button class="p-2 text-gray-300 hover:text-white">
                <i data-lucide="play" class="w-5 h-5 fill-current"></i>
              </button>
            `;
            div.onclick = () => playStream(song);
            container.appendChild(div);
          });
          lucide.createIcons();
        } else {
          container.innerHTML = `<p class="text-xs text-gray-500 text-center py-6">ไม่พบเพลง</p>`;
        }
      } catch (err) {
        container.innerHTML = `<p class="text-xs text-red-400 text-center py-6">เชื่อมต่อ Backend ไม่สำเร็จ กรุณาตรวจสอบ URL หรือสถานะเซิร์ฟเวอร์</p>`;
      }
    }

    // ฟังก์ชันเล่นเพลงผ่าน Stream โดยตรง
    function playStream(song) {
      document.getElementById('player-thumb').src = song.cover;
      document.getElementById('player-title').innerText = song.title;
      document.getElementById('player-artist').innerText = song.artist;

      audio.src = `${BACKEND_URL}/api/stream?id=${song.id}`;
      audio.play();
      isPlaying = true;
      updatePlayIcon();
    }

    document.getElementById('play-pause-btn').onclick = () => {
      if (audio.paused) {
        audio.play();
        isPlaying = true;
      } else {
        audio.pause();
        isPlaying = false;
      }
      updatePlayIcon();
    };

    function updatePlayIcon() {
      const icon = document.getElementById('play-icon');
      if (isPlaying) {
        icon.setAttribute('data-lucide', 'pause');
      } else {
        icon.setAttribute('data-lucide', 'play');
      }
      lucide.createIcons();
    }

    audio.ontimeupdate = () => {
      if (audio.duration) {
        const pct = (audio.currentTime / audio.duration) * 100;
        document.getElementById('player-progress').style.width = pct + '%';
      }
    };

    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden'));
      document.getElementById(`tab-${tabId}`).classList.remove('hidden');
    }

    lucide.createIcons();
  </script>
</body>
</html>
