<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>YouTube Music Clone</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      font-family: 'Prompt', sans-serif;
      background-color: #030303;
      color: #ffffff;
      -webkit-tap-highlight-color: transparent;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .line-clamp-1 {
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
  </style>
</head>
<body class="flex justify-center min-h-screen bg-black select-none">

  <!-- Mobile Frame Container -->
  <div class="relative w-full max-w-md bg-[#030303] min-h-screen pb-32 flex flex-col shadow-2xl overflow-x-hidden">

    <!-- Top Header -->
    <header class="sticky top-0 z-30 flex items-center justify-between px-4 py-3 bg-[#030303]/90 backdrop-blur-md">
      <div class="flex items-center gap-1.5 cursor-pointer" onclick="switchTab('home')">
        <div class="flex items-center justify-center w-7 h-7 bg-red-600 rounded-full text-white">
          <i data-lucide="play" class="w-3.5 h-3.5 fill-white ml-0.5"></i>
        </div>
        <span class="text-xl font-bold tracking-tight">Music</span>
      </div>
      <div class="flex items-center gap-4">
        <button onclick="switchTab('search')" class="text-gray-300 hover:text-white transition">
          <i data-lucide="search" class="w-5 h-5"></i>
        </button>
        <div class="w-7 h-7 rounded-full bg-emerald-600 overflow-hidden border border-gray-700">
          <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&auto=format&fit=crop" class="w-full h-full object-cover" alt="Avatar"/>
        </div>
      </div>
    </header>

    <!-- ==================== TAB 1: หน้าแรก (HOME) ==================== -->
    <main id="tab-home" class="tab-content flex flex-col">
      <!-- Filter Mood Chips -->
      <div class="flex gap-2 px-4 py-2 overflow-x-auto no-scrollbar">
        <button onclick="filterCategory('all', this)" class="mood-chip px-3.5 py-1.5 rounded-lg text-xs font-medium bg-white text-black whitespace-nowrap transition">ทั้งหมด</button>
        <button onclick="filterCategory('energetic', this)" class="mood-chip px-3.5 py-1.5 rounded-lg text-xs font-medium bg-[#212121] text-gray-200 whitespace-nowrap transition">กระปรี้กระเปร่า</button>
        <button onclick="filterCategory('feelgood', this)" class="mood-chip px-3.5 py-1.5 rounded-lg text-xs font-medium bg-[#212121] text-gray-200 whitespace-nowrap transition">รู้สึกดี</button>
        <button onclick="filterCategory('relax', this)" class="mood-chip px-3.5 py-1.5 rounded-lg text-xs font-medium bg-[#212121] text-gray-200 whitespace-nowrap transition">ผ่อนคลาย</button>
        <button onclick="filterCategory('focus', this)" class="mood-chip px-3.5 py-1.5 rounded-lg text-xs font-medium bg-[#212121] text-gray-200 whitespace-nowrap transition">มีสมาธิ</button>
      </div>

      <!-- Quick Picks Section (โทรด่วน) -->
      <section class="mt-4 px-4">
        <div class="flex items-center gap-2 mb-2">
          <div class="w-5 h-5 rounded-full overflow-hidden">
            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&auto=format&fit=crop" class="w-full h-full object-cover" alt="User"/>
          </div>
          <span class="text-xs text-gray-400 uppercase tracking-wide">NAT189</span>
        </div>
        <h2 class="text-2xl font-bold tracking-tight mb-3">โทรด่วน</h2>

        <!-- Grid 3x3 Cards -->
        <div id="quick-picks-grid" class="grid grid-cols-3 gap-3"></div>

        <!-- Pagination Dots -->
        <div class="flex justify-center items-center gap-1.5 mt-4">
          <div class="w-1.5 h-1.5 rounded-full bg-white"></div>
          <div class="w-1.5 h-1.5 rounded-full bg-gray-600"></div>
          <div class="w-1.5 h-1.5 rounded-full bg-gray-600"></div>
        </div>
      </section>

      <!-- Curated Section -->
      <section class="mt-8 px-4">
        <div class="flex items-center justify-between mb-3">
          <h2 class="text-xl font-bold tracking-tight">คัดสรรมาแล้ว</h2>
          <button onclick="playSong(currentSongList[0])" class="text-xs text-gray-400 hover:text-white px-2.5 py-1 rounded-full border border-gray-700">เล่นทั้งหมด</button>
        </div>
        <div id="curated-list" class="flex flex-col gap-2"></div>
      </section>
    </main>

    <!-- ==================== TAB 2: ค้นหา (SEARCH - ไร้ API KEY) ==================== -->
    <main id="tab-search" class="tab-content hidden flex-col px-4 pt-2">
      <!-- Search Box Input -->
      <div class="relative flex items-center mb-3">
        <i data-lucide="search" class="w-4 h-4 text-gray-400 absolute left-3.5 pointer-events-none"></i>
        <input id="search-input" type="text" placeholder="พิมพ์ชื่อเพลง ศิลปิน หรือวางลิงก์ YouTube..." 
               class="w-full pl-10 pr-10 py-2.5 bg-[#212121] rounded-lg text-sm text-white placeholder-gray-400 focus:outline-none focus:ring-1 focus:ring-white"
               onkeypress="if(event.key === 'Enter') handleSearch()" />
        <button id="search-clear-btn" onclick="clearSearch()" class="hidden absolute right-3 text-gray-400 hover:text-white">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <button onclick="handleSearch()" class="w-full py-2 bg-red-600 hover:bg-red-700 text-white rounded-lg text-xs font-semibold mb-4 transition flex items-center justify-center gap-1.5">
        <i data-lucide="search" class="w-3.5 h-3.5"></i> ค้นหาเพลงทันที (ไม่ต้องใช้ API Key)
      </button>

      <!-- Search Results List -->
      <div id="search-results" class="flex flex-col gap-2 pb-10">
        <p class="text-xs text-gray-500 text-center py-8">พิมพ์ชื่อเพลงที่ต้องการฟัง แล้วกดปุ่มค้นหาได้เลยครับ</p>
      </div>
    </main>

    <!-- ==================== TAB 3: คลังเพลง (LIBRARY) ==================== -->
    <main id="tab-library" class="tab-content hidden flex-col px-4 pt-4">
      <h2 class="text-2xl font-bold tracking-tight mb-4">คลังเพลงของคุณ</h2>
      <h3 class="text-sm font-semibold text-gray-300 mb-2 flex items-center gap-1.5">
        <i data-lucide="history" class="w-4 h-4 text-red-500"></i> ประวัติเพลงที่ฟังล่าสุด
      </h3>
      <div id="library-recent-list" class="flex flex-col gap-2 pb-10">
        <p class="text-xs text-gray-500 py-4">ยังไม่มีประวัติการฟังเพลง</p>
      </div>
    </main>

    <!-- Hidden YouTube Player Container -->
    <div style="position: fixed; top: -9999px; left: -9999px; width: 200px; height: 200px; opacity: 0; pointer-events: none;">
      <div id="youtube-player"></div>
    </div>

    <!-- Floating Mini Player -->
    <div id="mini-player" class="fixed bottom-[54px] left-1/2 -translate-x-1/2 w-full max-w-md px-3 z-40">
      <div class="bg-[#212121] rounded-lg p-2 flex items-center justify-between shadow-2xl border border-white/5 backdrop-blur-md">
        <div class="flex items-center gap-3 overflow-hidden cursor-pointer flex-1" onclick="openFullPlayer()">
          <img id="player-thumb" src="https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=100&auto=format&fit=crop" class="w-10 h-10 rounded object-cover flex-shrink-0" alt="Cover"/>
          <div class="overflow-hidden">
            <h4 id="player-title" class="text-sm font-semibold text-white line-clamp-1">เลือกเพลงเพื่อฟัง</h4>
            <p id="player-artist" class="text-xs text-gray-400 line-clamp-1">แตะการ์ดเพลงหรือค้นหาเพลง</p>
          </div>
        </div>
        <div class="flex items-center gap-2 pl-2">
          <button id="play-pause-btn" class="p-1.5 text-white transition">
            <i id="play-pause-icon" data-lucide="play" class="w-6 h-6 fill-white"></i>
          </button>
        </div>
      </div>
      <!-- Progress Bar -->
      <div class="w-full bg-gray-700 h-[2px] mt-0.5 rounded-full overflow-hidden">
        <div id="player-progress" class="bg-red-500 h-full w-0 transition-all duration-300"></div>
      </div>
    </div>

    <!-- ==================== FULL SCREEN PLAYER MODAL ==================== -->
    <div id="full-player-modal" class="fixed inset-0 bg-[#030303] z-50 flex flex-col justify-between p-6 transform translate-y-full transition-transform duration-300 ease-out max-w-md mx-auto">
      <div class="flex items-center justify-between">
        <button onclick="closeFullPlayer()" class="p-2 text-gray-400 hover:text-white">
          <i data-lucide="chevron-down" class="w-6 h-6"></i>
        </button>
        <span class="text-xs font-semibold uppercase tracking-widest text-gray-400">กำลังเล่นเพลง</span>
        <div class="w-6"></div>
      </div>

      <div class="flex flex-col items-center my-auto">
        <div class="w-64 h-64 rounded-2xl overflow-hidden shadow-2xl border border-white/10 mb-8">
          <img id="full-player-thumb" src="https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=500&auto=format&fit=crop" class="w-full h-full object-cover" alt="Cover" />
        </div>
        <h2 id="full-player-title" class="text-xl font-bold text-center text-white line-clamp-1 px-4 mb-1">ชื่อเพลง</h2>
        <p id="full-player-artist" class="text-sm text-gray-400 text-center line-clamp-1">ศิลปิน</p>
      </div>

      <div class="flex flex-col gap-4">
        <div>
          <input id="full-player-seek" type="range" min="0" max="100" value="0" class="w-full h-1 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-red-600" onchange="seekSong(this.value)">
          <div class="flex justify-between text-[11px] text-gray-400 mt-1">
            <span id="current-time">0:00</span>
            <span id="duration-time">0:00</span>
          </div>
        </div>

        <div class="flex items-center justify-center gap-8 py-2">
          <button onclick="prevSong()" class="text-gray-300 hover:text-white">
            <i data-lucide="skip-back" class="w-7 h-7 fill-current"></i>
          </button>
          <button onclick="togglePlayPause()" class="w-14 h-14 bg-white text-black rounded-full flex items-center justify-center hover:scale-105 transition">
            <i id="full-play-icon" data-lucide="play" class="w-6 h-6 fill-black ml-0.5"></i>
          </button>
          <button onclick="nextSong()" class="text-gray-300 hover:text-white">
            <i data-lucide="skip-forward" class="w-7 h-7 fill-current"></i>
          </button>
        </div>
      </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <nav class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md bg-[#101010]/95 border-t border-white/5 py-1.5 px-3 z-50 flex justify-around items-center backdrop-blur-lg">
      <button id="nav-home" onclick="switchTab('home')" class="nav-btn flex flex-col items-center text-white gap-1">
        <i data-lucide="home" class="w-5 h-5"></i>
        <span class="text-[10px] font-medium">หน้าแรก</span>
      </button>
      <button id="nav-search" onclick="switchTab('search')" class="nav-btn flex flex-col items-center text-gray-400 hover:text-white gap-1">
        <i data-lucide="search" class="w-5 h-5"></i>
        <span class="text-[10px] font-medium">ค้นหา</span>
      </button>
      <button id="nav-library" onclick="switchTab('library')" class="nav-btn flex flex-col items-center text-gray-400 hover:text-white gap-1">
        <i data-lucide="library" class="w-5 h-5"></i>
        <span class="text-[10px] font-medium">คลังเพลง</span>
      </button>
    </nav>

  </div>

  <!-- YouTube IFrame API -->
  <script src="https://www.youtube.com/iframe_api"></script>

  <script>
    const allSongData = {
      energetic: [
        { id: 'bM7SZ5SBzyY', title: 'Sky High', artist: 'Elektronomia', cover: 'https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?w=300&auto=format&fit=crop' },
        { id: 'J2X5mJ3HDYE', title: 'Invincible', artist: 'DEAF KEV', cover: 'https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=300&auto=format&fit=crop' },
        { id: 'K4DyBUG242c', title: 'On & On', artist: 'Cartoon feat. Daniel Levi', cover: 'https://images.unsplash.com/photo-1518609878373-06d740f60d8b?w=300&auto=format&fit=crop' }
      ],
      feelgood: [
        { id: 'p7ZsBPK656s', title: 'Spectre', artist: 'Alan Walker (NCS)', cover: 'https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=300&auto=format&fit=crop' },
        { id: '3nQNiWdeH2Q', title: 'Heroes Tonight', artist: 'Janji feat. Johnning', cover: 'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=300&auto=format&fit=crop' },
        { id: 'S19UcWdOA-I', title: 'Hope', artist: 'Tobu', cover: 'https://images.unsplash.com/photo-1520523839898-5071282543e2?w=300&auto=format&fit=crop' }
      ],
      relax: [
        { id: 'DWcJFNfaw9c', title: 'Wish (Acoustic Guitar)', artist: 'Depapepe', cover: 'https://images.unsplash.com/photo-1507838153414-b4b713384a76?w=300&auto=format&fit=crop' },
        { id: 'TW9d8vYrVFQ', title: 'My Heart', artist: 'Different Heaven & EH!DE', cover: 'https://images.unsplash.com/photo-1487180144351-b8472da7d491?w=300&auto=format&fit=crop' },
        { id: 'AOeY-nDp7hI', title: 'Blank', artist: 'Disfigure', cover: 'https://images.unsplash.com/photo-1459749411175-04bf5292ceea?w=300&auto=format&fit=crop' }
      ],
      focus: [
        { id: 'DWcJFNfaw9c', title: 'Start (Acoustic)', artist: 'Depapepe', cover: 'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=300&auto=format&fit=crop' },
        { id: 'K4DyBUG242c', title: 'Chill Vibes', artist: 'NCS Chill', cover: 'https://images.unsplash.com/photo-1518609878373-06d740f60d8b?w=300&auto=format&fit=crop' }
      ]
    };

    let currentSongList = [...allSongData.energetic, ...allSongData.feelgood, ...allSongData.relax];
    let currentSong = null;
    let player = null;
    let isPlayerReady = false;
    let isPlaying = false;
    let recentHistory = JSON.parse(localStorage.getItem('yt_music_history') || '[]');

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('youtube-player', {
        height: '200',
        width: '200',
        playerVars: { autoplay: 1, playsinline: 1, controls: 0, rel: 0, origin: window.location.origin },
        events: {
          'onReady': () => { isPlayerReady = true; },
          'onStateChange': onPlayerStateChange,
          'onError': onPlayerError
        }
      });
    }

    function onPlayerStateChange(event) {
      const playIcon = document.getElementById('play-pause-icon');
      const fullPlayIcon = document.getElementById('full-play-icon');
      if (event.data === YT.PlayerState.PLAYING) {
        isPlaying = true;
        playIcon.setAttribute('data-lucide', 'pause');
        fullPlayIcon.setAttribute('data-lucide', 'pause');
      } else {
        isPlaying = false;
        playIcon.setAttribute('data-lucide', 'play');
        fullPlayIcon.setAttribute('data-lucide', 'play');
      }
      lucide.createIcons();
    }

    function onPlayerError(event) {
      if (event.data === 150 || event.data === 101) {
        alert('เพลงนี้ถูกปิดกั้นการเล่นนอกเว็บโดยเจ้าของลิขสิทธิ์ (Error 150) กรุณาลองเพลงอื่นครับ');
      }
    }

    function playSong(song) {
      if (!song || !song.id) return;
      currentSong = song;

      recentHistory = recentHistory.filter(item => item.id !== song.id);
      recentHistory.unshift(song);
      if (recentHistory.length > 20) recentHistory.pop();
      localStorage.setItem('yt_music_history', JSON.stringify(recentHistory));
      renderLibrary();

      document.getElementById('player-thumb').src = song.cover;
      document.getElementById('player-title').innerText = song.title;
      document.getElementById('player-artist').innerText = song.artist;

      document.getElementById('full-player-thumb').src = song.cover;
      document.getElementById('full-player-title').innerText = song.title;
      document.getElementById('full-player-artist').innerText = song.artist;

      if (isPlayerReady && player && player.loadVideoById) {
        player.loadVideoById(song.id);
        player.playVideo();
      }
    }

    function togglePlayPause() {
      if (!isPlayerReady || !player) return;
      if (isPlaying) {
        player.pauseVideo();
      } else {
        if (!currentSong) {
          playSong(currentSongList[0]);
        } else {
          player.playVideo();
        }
      }
    }

    document.getElementById('play-pause-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      togglePlayPause();
    });

    function nextSong() {
      const idx = currentSongList.findIndex(s => s.id === currentSong?.id);
      if (idx !== -1 && idx + 1 < currentSongList.length) {
        playSong(currentSongList[idx + 1]);
      } else {
        playSong(currentSongList[0]);
      }
    }

    function prevSong() {
      const idx = currentSongList.findIndex(s => s.id === currentSong?.id);
      if (idx > 0) {
        playSong(currentSongList[idx - 1]);
      }
    }

    function seekSong(val) {
      if (!player || !player.getDuration) return;
      const targetSec = (val / 100) * player.getDuration();
      player.seekTo(targetSec, true);
    }

    setInterval(() => {
      if (isPlayerReady && player && isPlaying && player.getCurrentTime && player.getDuration) {
        const cur = player.getCurrentTime();
        const dur = player.getDuration();
        if (dur > 0) {
          const pct = (cur / dur) * 100;
          document.getElementById('player-progress').style.width = pct + '%';
          document.getElementById('full-player-seek').value = pct;
          document.getElementById('current-time').innerText = formatTime(cur);
          document.getElementById('duration-time').innerText = formatTime(dur);
        }
      }
    }, 500);

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.add('hidden'));
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.remove('text-white');
        btn.classList.add('text-gray-400');
      });

      document.getElementById(`tab-${tabId}`).classList.remove('hidden');
      const activeBtn = document.getElementById(`nav-${tabId}`);
      if (activeBtn) {
        activeBtn.classList.remove('text-gray-400');
        activeBtn.classList.add('text-white');
      }
      lucide.createIcons();
    }

    function extractYouTubeId(url) {
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    // ==================== ฟังก์ชันค้นหาแบบไม่ต้องใช้ API KEY ====================
    async function handleSearch() {
      const query = document.getElementById('search-input').value.trim();
      if (!query) return;

      const resultsDiv = document.getElementById('search-results');

      // 1. ตรวจสอบว่าผู้ใช้วาง Link YouTube หรือ Video ID โดยตรงหรือไม่
      const extractedId = extractYouTubeId(query) || (query.length === 11 && !query.includes(' ') ? query : null);
      if (extractedId) {
        const directSong = {
          id: extractedId,
          title: `YouTube Video (${extractedId})`,
          artist: 'เล่นจากลิงก์ตรง',
          cover: `https://img.youtube.com/vi/${extractedId}/hqdefault.jpg`
        };
        playSong(directSong);
        resultsDiv.innerHTML = `
          <div class="p-3 bg-[#181818] rounded-lg flex items-center justify-between border border-green-700/50">
            <div>
              <p class="text-xs text-green-400 font-semibold">กำลังเล่นจากลิงก์โดยตรง</p>
              <p class="text-sm font-medium text-white">${directSong.title}</p>
            </div>
            <i data-lucide="play-circle" class="w-6 h-6 text-green-400"></i>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      // 2. ค้นหาผ่าน Open Invidious API โดยไม่ต้องใช้ API Key
      resultsDiv.innerHTML = `<p class="text-xs text-gray-400 text-center py-6">กำลังค้นหาเพลง...</p>`;
      
      const publicInstances = [
        'https://inv.tux.pizza',
        'https://invidious.nerdvpn.de',
        'https://inv.nadeko.net'
      ];

      let foundVideos = null;

      for (let instance of publicInstances) {
        try {
          const res = await fetch(`${instance}/api/v1/search?q=${encodeURIComponent(query)}&type=video`, { signal: AbortSignal.timeout(4000) });
          if (res.ok) {
            const data = await res.json();
            if (Array.isArray(data) && data.length > 0) {
              foundVideos = data;
              break;
            }
          }
        } catch (e) {
          // ลอง instance ถัดไปถ้าตัวนี้ช้าหรือไม่ตอบสนอง
          continue;
        }
      }

      if (foundVideos && foundVideos.length > 0) {
        resultsDiv.innerHTML = '';
        foundVideos.slice(0, 10).forEach(item => {
          let thumb = `https://img.youtube.com/vi/${item.videoId}/hqdefault.jpg`;
          if (item.videoThumbnails && item.videoThumbnails.length > 0) {
            thumb = item.videoThumbnails[0].url;
          }
          const song = {
            id: item.videoId,
            title: item.title,
            artist: item.author || 'YouTube Artist',
            cover: thumb
          };
          renderSearchItem(song, resultsDiv);
        });
        lucide.createIcons();
        return;
      }

      // 3. Fallback: ถ้าไม่พบ ให้ค้นหาจากเพลงแนะนำภายในแอป
      const localMatches = currentSongList.filter(s => s.title.toLowerCase().includes(query.toLowerCase()) || s.artist.toLowerCase().includes(query.toLowerCase()));
      if (localMatches.length > 0) {
        resultsDiv.innerHTML = '<p class="text-xs text-gray-400 mb-2">ผลลัพธ์จากคลังเพลงแนะนำ:</p>';
        localMatches.forEach(song => renderSearchItem(song, resultsDiv));
      } else {
        resultsDiv.innerHTML = `
          <div class="text-center py-8">
            <p class="text-sm text-gray-300 font-medium">ไม่พบผลการค้นหา</p>
            <p class="text-xs text-gray-500 mt-1">คุณสามารถคัดลอกลิงก์จาก YouTube มาวางในช่องค้นหาเพื่อเล่นได้ทันทีครับ</p>
          </div>
        `;
      }
      lucide.createIcons();
    }

    function renderSearchItem(song, container) {
      const div = document.createElement('div');
      div.className = "flex items-center justify-between p-2 rounded-lg hover:bg-[#1a1a1a] cursor-pointer transition border border-white/5";
      div.innerHTML = `
        <div class="flex items-center gap-3 overflow-hidden">
          <img src="${song.cover}" class="w-12 h-12 rounded object-cover flex-shrink-0" alt="Thumb"/>
          <div class="overflow-hidden">
            <h4 class="text-sm font-medium text-white line-clamp-1">${song.title}</h4>
            <p class="text-xs text-gray-400 line-clamp-1">${song.artist}</p>
          </div>
        </div>
        <button class="p-2 text-gray-300 hover:text-white">
          <i data-lucide="play" class="w-5 h-5 fill-current"></i>
        </button>
      `;
      div.onclick = () => playSong(song);
      container.appendChild(div);
    }

    function clearSearch() {
      document.getElementById('search-input').value = '';
      document.getElementById('search-results').innerHTML = '<p class="text-xs text-gray-500 text-center py-8">พิมพ์ชื่อเพลงที่ต้องการฟัง แล้วกดปุ่มค้นหาได้เลยครับ</p>';
    }

    function filterCategory(cat, btn) {
      document.querySelectorAll('.mood-chip').forEach(c => {
        c.className = "mood-chip px-3.5 py-1.5 rounded-lg text-xs font-medium bg-[#212121] text-gray-200 whitespace-nowrap transition";
      });
      btn.className = "mood-chip px-3.5 py-1.5 rounded-lg text-xs font-medium bg-white text-black whitespace-nowrap transition";

      if (cat === 'all') {
        currentSongList = [...allSongData.energetic, ...allSongData.feelgood, ...allSongData.relax];
      } else if (allSongData[cat]) {
        currentSongList = allSongData[cat];
      }
      renderHomeGrids();
    }

    function renderHomeGrids() {
      const grid = document.getElementById('quick-picks-grid');
      grid.innerHTML = '';
      currentSongList.slice(0, 9).forEach(song => {
        const card = document.createElement('div');
        card.className = "cursor-pointer group flex flex-col";
        card.innerHTML = `
          <div class="relative w-full aspect-square rounded-lg overflow-hidden mb-1.5 bg-[#181818]">
            <img src="${song.cover}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" alt="${song.title}"/>
            <div class="absolute inset-0 bg-black/20 group-hover:bg-black/40 flex items-center justify-center opacity-0 group-hover:opacity-100 transition">
              <i data-lucide="play" class="w-6 h-6 text-white fill-white"></i>
            </div>
          </div>
          <h3 class="text-xs font-medium text-white line-clamp-1">${song.title}</h3>
          <p class="text-[10px] text-gray-400 line-clamp-1">${song.artist}</p>
        `;
        card.onclick = () => playSong(song);
        grid.appendChild(card);
      });

      const curated = document.getElementById('curated-list');
      curated.innerHTML = '';
      currentSongList.slice(0, 4).forEach(song => {
        renderSearchItem(song, curated);
      });
      lucide.createIcons();
    }

    function renderLibrary() {
      const lib = document.getElementById('library-recent-list');
      if (recentHistory.length === 0) {
        lib.innerHTML = '<p class="text-xs text-gray-500 py-4">ยังไม่มีประวัติการฟังเพลง</p>';
        return;
      }
      lib.innerHTML = '';
      recentHistory.forEach(song => renderSearchItem(song, lib));
      lucide.createIcons();
    }

    function openFullPlayer() {
      document.getElementById('full-player-modal').classList.remove('translate-y-full');
    }
    function closeFullPlayer() {
      document.getElementById('full-player-modal').classList.add('translate-y-full');
    }

    renderHomeGrids();
    renderLibrary();
    lucide.createIcons();
  </script>
</body>
</html>
